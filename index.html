<script>

function euro(value) {
  return value.toLocaleString("de-DE", {
    style: "currency",
    currency: "EUR"
  });
}

// SF-Faktoren (vereinfachte Realität)
const sfFactors = {
  0: 1.20,
  1: 1.15,
  2: 1.10,
  3: 1.05,
  4: 1.00,
  5: 0.95,
  6: 0.90,
  7: 0.85,
  8: 0.80,
  9: 0.75,
  10: 0.70,
  15: 0.65,
  20: 0.60,
  25: 0.55,
  30: 0.50,
  35: 0.45
};

function calculate() {

  const monthly = Number(document.getElementById("monthly").value) || 0;
  const years = Number(document.getElementById("years").value) || 0;
  const once = Number(document.getElementById("once").value) || 0;
  const discount = Number(document.getElementById("discount").value) || 0;

  // SF nur wenn sichtbar
  const sfVisible = document.getElementById("sfField").style.display === "block";
  const sf = sfVisible ? Number(document.getElementById("sf").value) : null;

  const sfFactor = sf !== null ? sfFactors[sf] : 1;

  const monthlyAdjusted = monthly * sfFactor;

  const total =
    monthlyAdjusted * 12 * years +
    once -
    discount;

  const yearly = monthlyAdjusted * 12;

  const daily = total / (years * 365);

  document.getElementById("result").innerHTML = `
    <div class="result-box">
      <div>Deine Gesamtkosten:</div>
      <div class="big">${euro(total)}</div>

      <div class="result-grid">
        <div class="result-item">
          <small>pro Monat</small>
          <strong>${euro(monthlyAdjusted)}</strong>
        </div>

        <div class="result-item">
          <small>pro Jahr</small>
          <strong>${euro(yearly)}</strong>
        </div>

        <div class="result-item">
          <small>pro Tag</small>
          <strong>${euro(daily)}</strong>
        </div>
      </div>
    </div>
  `;
}

function showCalculator(category) {

  document.getElementById("calculatorTitle").innerText =
    "💰 " + category + "-Rechner";

  // SF nur bei Auto anzeigen
  if (category === "Auto") {
    document.getElementById("sfField").style.display = "block";
  } else {
    document.getElementById("sfField").style.display = "none";
  }

  document.querySelector(".calculator")
    .scrollIntoView({
      behavior: "smooth"
    });
}

calculate();

</script>
