<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echtkosten Rechner</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    h1 { color: #0078d7; }
    .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; }
    input, select { width: 100%; padding: 10px; margin-top: 10px; }
    button { margin-top: 20px; padding: 10px; width: 100%; background: #0078d7; color: white; border: none; border-radius: 5px; }
    #result { margin-top: 20px; font-size: 1.2rem; }
  </style>
</head>
<body>

<h1>Echtkosten Rechner</h1>

<div class="box">
  <label>Einmalige Kosten (€)</label>
  <input id="einmalig" type="number">

  <label>Monatliche Kosten (€)</label>
  <input id="monatlich" type="number">

  <label>Jährliche Kosten (€)</label>
  <input id="jaehrlich" type="number">

  <label>Zusatzkosten (€)</label>
  <input id="zusatz" type="number">

  <label>Rabatt (%)</label>
  <input id="rabatt" type="number">

  <label>Laufzeit</label>
  <select id="laufzeitTyp">
    <option value="monate">Monate</option>
    <option value="jahre">Jahre</option>
  </select>

  <label>Laufzeit Anzahl</label>
  <input id="laufzeit" type="number">

  <button onclick="berechnen()">Berechnen</button>

  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
